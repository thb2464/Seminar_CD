name: Catalog Service CI

on:
  pull_request:
    paths:
      - "SeminarCD_TVB/services/catalog-service/**"
      - ".github/workflows/_service.yml"
  push:
    branches:
      - main
      - claude/happy-cerf-cc9584
    paths:
      - "SeminarCD_TVB/services/catalog-service/**"
      - ".github/workflows/_service.yml"

jobs:
  ci:
    uses: ./.github/workflows/_service.yml
    with:
      service_name: Catalog Service
      service_path: SeminarCD_TVB/services/catalog-service
      language: node
      docker_image_name: ghcr.io/${{ github.repository }}/catalog-service
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
