name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service_name:
        description: Human-readable service name used in job labels.
        required: true
        type: string
      service_path:
        description: Path to the service directory from the repository root.
        required: true
        type: string
      language:
        description: Runtime family for lint/test/build steps.
        required: false
        default: node
        type: string
      node_version:
        description: Node.js version for NestJS and Strapi services.
        required: false
        default: "22"
        type: string
      python_version:
        description: Python version for FastAPI services.
        required: false
        default: "3.11"
        type: string
      docker_image_name:
        description: Optional full image repository, for example ghcr.io/acme/travel-tvb/catalog-service.
        required: false
        default: ""
        type: string
      push_image:
        description: Push the built Docker image to GHCR.
        required: false
        default: false
        type: boolean

jobs:
  lint-test-build:
    name: ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.service_path }}/package-lock.json

      - name: Install Node dependencies
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_path }}
        run: npm ci

      - name: Lint Node service
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_path }}
        run: npm run lint --if-present

      - name: Test Node service
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_path }}
        run: npm run test --if-present

      - name: Build Node service
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_path }}
        run: npm run build --if-present

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install Python dependencies
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint Python service
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: python -m ruff check .

      - name: Type-check Python service
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: python -m mypy .

      - name: Test Python service
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_path }}
        run: python -m pytest

      - name: Build Docker image
        if: inputs.docker_image_name != ''
        run: |
          docker build \
            --tag ${{ inputs.docker_image_name }}:${{ github.sha }} \
            --tag ${{ inputs.docker_image_name }}:latest \
            ${{ inputs.service_path }}

      - name: Login to GHCR
        if: inputs.push_image && inputs.docker_image_name != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: inputs.push_image && inputs.docker_image_name != ''
        run: |
          docker push ${{ inputs.docker_image_name }}:${{ github.sha }}
          docker push ${{ inputs.docker_image_name }}:latest
