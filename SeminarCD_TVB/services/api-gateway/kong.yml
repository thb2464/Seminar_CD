_format_version: "3.0"
_transform: true

# Travel TVB API Gateway — Kong declarative config (DB-less mode).
#
# Each microservice gets a `service` + one or more `routes`. Where the
# downstream path differs from the public path, a `request-transformer`
# plugin rewrites the prefix so the frontend's existing URLs keep working.
#
# Services added incrementally per the sprint plan:
#   Sprint 1: ai-chatbot-service
#   Sprint 2: identity-service (JWT-validated routes)
#   Sprint 3: catalog-service
#   Sprint 4: content-service (Strapi)
#   Sprint 5: booking-service, payment-service

# --- Consumers & JWT credentials -------------------------------------------------
# One shared consumer represents authenticated end-users. The Identity Service
# signs JWTs with `iss = "identity-service"`; Kong validates the signature with
# the same secret. In production this section should be replaced by an
# Identity-Service-driven admin-API call so each user becomes its own consumer
# (and rate limiting can be per-user). For the seminar capstone, one consumer
# is enough.
#
# JWT_SHARED_SECRET must match the Identity Service's `JWT_SECRET`. Kong's
# DB-less config does not template env vars natively; replace at deploy time
# with `envsubst < kong.yml.tpl > kong.yml`, or use the Admin API patch.
consumers:
  - username: travel-tvb-frontend
    custom_id: travel-tvb-frontend
    jwt_secrets:
      - key: identity-service
        algorithm: HS256
        secret: change-me-in-prod

services:
  # --- AI Chatbot Service (Sprint 1) ---------------------------------------------
  - name: ai-chatbot-service
    url: http://ai-chatbot-service:8080
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    retries: 1
    routes:
      - name: chatbot-query
        protocols: [http, https]
        paths:
          - /api/chatbot/query
        methods: [POST, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /api/chat/query

      - name: chatbot-health
        protocols: [http, https]
        paths:
          - /api/chatbot/health
        methods: [GET]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /health

  # --- Identity Service (Sprint 2) ----------------------------------------------
  - name: identity-service
    url: http://identity-service:3000
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 1
    routes:
      # Public — login / register. No JWT required.
      - name: auth-login
        protocols: [http, https]
        paths:
          - /api/auth/local
        methods: [POST, OPTIONS]
        strip_path: false

      - name: auth-register
        protocols: [http, https]
        paths:
          - /api/auth/local/register
        methods: [POST, OPTIONS]
        strip_path: false

      # Protected — validates JWT at the gateway and injects X-User-Id / X-User-Role
      # so downstream services don't have to re-validate the token.
      - name: users-me
        protocols: [http, https]
        paths:
          - /api/users/me
        methods: [GET, OPTIONS]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              key_claim_name: iss
              run_on_preflight: false
          - name: post-function
            # After Kong's jwt plugin sets ngx.ctx.authenticated_jwt_token,
            # decode the claims and forward sub/role downstream as the
            # X-User-Id / X-User-Role headers our services trust.
            config:
              access:
                - |
                    local jwt_decoder = require "kong.plugins.jwt.jwt_parser"
                    local token = kong.ctx.shared.authenticated_jwt_token
                          or ngx.ctx.authenticated_jwt_token
                    if token then
                      local parsed, err = jwt_decoder:new(token)
                      if parsed then
                        local claims = parsed.claims
                        if claims and claims.sub then
                          kong.service.request.set_header("X-User-Id", tostring(claims.sub))
                        end
                        if claims and claims.role then
                          kong.service.request.set_header("X-User-Role", tostring(claims.role))
                        end
                      end
                    end

  # --- Catalog Service (Sprint 3) -----------------------------------------------
  - name: catalog-service
    url: http://catalog-service:3001
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 1
    routes:
      # Public reads — the chatbot and the public website both consume these.
      - name: catalog-tours-list
        protocols: [http, https]
        paths:
          - /api/tours
          - /api/tours/
        methods: [GET, OPTIONS]
        strip_path: false

      - name: catalog-tours-by-id
        protocols: [http, https]
        paths:
          - ~/api/tours/(?<id>\d+)$
        methods: [GET, OPTIONS]
        strip_path: false

      - name: catalog-tours-by-slug
        protocols: [http, https]
        paths:
          - ~/api/tours/slug/.+
        methods: [GET, OPTIONS]
        strip_path: false

      - name: catalog-categories
        protocols: [http, https]
        paths:
          - /api/tour-categories
          - /api/tour-categories/
        methods: [GET, OPTIONS]
        strip_path: false

      - name: catalog-categories-by-id
        protocols: [http, https]
        paths:
          - ~/api/tour-categories/\d+$
        methods: [GET, OPTIONS]
        strip_path: false

      # Writes — JWT-protected. Same plugin pair as /api/users/me; the catalog
      # service trusts the X-User-Id / X-User-Role headers set by post-function.
      - name: catalog-tours-write
        protocols: [http, https]
        paths:
          - /api/tours
          - ~/api/tours/\d+$
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              key_claim_name: iss
              run_on_preflight: false
          - name: post-function
            config:
              access:
                - |
                    local jwt_decoder = require "kong.plugins.jwt.jwt_parser"
                    local token = kong.ctx.shared.authenticated_jwt_token
                          or ngx.ctx.authenticated_jwt_token
                    if token then
                      local parsed = jwt_decoder:new(token)
                      if parsed then
                        local claims = parsed.claims
                        if claims and claims.sub then
                          kong.service.request.set_header("X-User-Id", tostring(claims.sub))
                        end
                        if claims and claims.role then
                          kong.service.request.set_header("X-User-Role", tostring(claims.role))
                        end
                      end
                    end

  # --- Content Service (Sprint 4) -----------------------------------------------
  - name: content-service
    url: http://content-service:1337
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 1
    routes:
      - name: content-api
        protocols: [http, https]
        paths:
          - /api/single-posts
          - /api/single-community-posts
          - /api/post-categories
          - /api/authors
          - /api/faqs
          - /api/newsletter-email-submissons
          - /api/about-heroes
          - /api/about-core-values
          - /api/about-journeys
          - /api/about-teams
          - /api/home-hero-sliders
          - /api/home-commitments
          - /api/home-diagrams
          - /api/home-portfolios
          - /api/home-statistics
          - /api/community-heroes
          - /api/news-heroes
          - /api/service-heroes
          - /api/layout-navbars
          - /api/layout-footers
          - /api/layout-cta-banners
          - /api/layout-newsletters
        methods: [GET, POST, OPTIONS]
        strip_path: false

  # --- Booking Service (Sprint 5) -----------------------------------------------
  - name: booking-service
    url: http://booking-service:3002
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 1
    routes:
      - name: booking-public
        protocols: [http, https]
        paths:
          - /api/bookings/availability
        methods: [GET, OPTIONS]
        strip_path: false

      - name: booking-protected
        protocols: [http, https]
        paths:
          - /api/bookings
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              key_claim_name: iss
              run_on_preflight: false
          - name: post-function
            config:
              access:
                - |
                    local jwt_decoder = require "kong.plugins.jwt.jwt_parser"
                    local token = kong.ctx.shared.authenticated_jwt_token or ngx.ctx.authenticated_jwt_token
                    if token then
                      local parsed = jwt_decoder:new(token)
                      if parsed then
                        local claims = parsed.claims
                        if claims and claims.sub then
                          kong.service.request.set_header("X-User-Id", tostring(claims.sub))
                        end
                        if claims and claims.role then
                          kong.service.request.set_header("X-User-Role", tostring(claims.role))
                        end
                      end
                    end

  # --- Payment Service (Sprint 5) -----------------------------------------------
  - name: payment-service
    url: http://payment-service:3003
    connect_timeout: 5000
    write_timeout: 15000
    read_timeout: 30000
    retries: 1
    routes:
      - name: payment-public
        protocols: [http, https]
        paths:
          - /api/payments/vnpay-return
        methods: [GET, OPTIONS]
        strip_path: false

      - name: payment-protected
        protocols: [http, https]
        paths:
          - /api/payments
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
              key_claim_name: iss
              run_on_preflight: false
          - name: post-function
            config:
              access:
                - |
                    local jwt_decoder = require "kong.plugins.jwt.jwt_parser"
                    local token = kong.ctx.shared.authenticated_jwt_token or ngx.ctx.authenticated_jwt_token
                    if token then
                      local parsed = jwt_decoder:new(token)
                      if parsed then
                        local claims = parsed.claims
                        if claims and claims.sub then
                          kong.service.request.set_header("X-User-Id", tostring(claims.sub))
                        end
                        if claims and claims.role then
                          kong.service.request.set_header("X-User-Role", tostring(claims.role))
                        end
                      end
                    end

plugins:
  # Global CORS for the frontend at localhost:5173 plus the production host.
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - https://dashboard.lamweb.fun
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Requested-With, X-Forwarded-For]
      exposed_headers: [X-Trace-Id]
      credentials: true
      max_age: 3600

  # Trace ID propagation — Kong generates one if the client didn't send it,
  # downstream services pick it up via the X-Trace-Id header (Phase 7 / F0.4).
  - name: correlation-id
    config:
      header_name: X-Trace-Id
      generator: uuid
      echo_downstream: true
