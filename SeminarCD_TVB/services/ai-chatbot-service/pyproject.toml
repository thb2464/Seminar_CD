[project]
name = "ai-chatbot-service"
version = "0.1.0"
description = "Travel TVB AI Chatbot — RAG over tour catalog using Gemini + ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-generativeai>=0.8.3",
    # Pin to 0.5.x — the ChromaDB server is on 0.5.20 (infra/docker-compose.yml).
    # Client 1.x crashes on get_or_create_collection against a 0.5.x server with
    # `'dict' object has no attribute 'serialize_to_json'`, so we cap below 1.0.0
    # until the server is bumped (which requires re-indexing the collection).
    "chromadb>=0.5.20,<1.0.0",
    "httpx>=0.27.0",
    "aio-pika>=9.4.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
index-tours = "app.scripts.index_tours:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
omit = [
    "app/scripts/index_tours.py",  # network-bound CLI; covered indirectly by chunk-builder tests
    "app/services/gemini.py",      # google-generativeai SDK shim; covered by test_gemini_retry.py at the retry layer
]
