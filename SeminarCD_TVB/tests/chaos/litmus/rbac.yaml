apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-tvb-chaos-sa
  namespace: staging
  labels:
    app.kubernetes.io/name: travel-tvb-chaos-sa
    app.kubernetes.io/part-of: travel-tvb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travel-tvb-chaos-runner
  namespace: staging
  labels:
    app.kubernetes.io/name: travel-tvb-chaos-runner
    app.kubernetes.io/part-of: travel-tvb
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "deletecollection", "get", "list"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travel-tvb-chaos-runner
  namespace: staging
  labels:
    app.kubernetes.io/name: travel-tvb-chaos-runner
    app.kubernetes.io/part-of: travel-tvb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: travel-tvb-chaos-runner
subjects:
  - kind: ServiceAccount
    name: travel-tvb-chaos-sa
    namespace: staging
