<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" width="1500" height="1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title     { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle  { font-size: 13px; fill: #475569; }
      .ll-title  { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ll-sub    { font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
      .msg-lbl   { font-size: 12px; fill: #0f172a; }
      .msg-num   { font-size: 11px; font-weight: 700; fill: #1e3a8a; }
      .note      { font-size: 11px; fill: #334155; }
      .frame-lbl { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .frame-cond{ font-size: 11px; fill: #0f172a; font-style: italic; }
    </style>
    <marker id="sync" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#0f172a"/>
    </marker>
    <marker id="ret" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1500" height="1020" fill="#f8fafc"/>

  <text x="750" y="36" text-anchor="middle" class="title">Hình 3.7: Sequence Diagram — Chatbot RAG Pipeline</text>
  <text x="750" y="58" text-anchor="middle" class="subtitle">Luồng xử lý câu hỏi người dùng qua 6 lifelines: User, Frontend, Backend, ChromaDB, Gemini Embed API, Gemini 2.5 Flash</text>

  <!-- ========== LIFELINE HEADS ========== -->
  <rect x="40" y="90" width="160" height="58" rx="6" fill="#1e3a8a"/>
  <text x="120" y="115" class="ll-title">Người dùng</text>
  <text x="120" y="134" class="ll-sub">:User (Actor)</text>

  <rect x="260" y="90" width="180" height="58" rx="6" fill="#0369a1"/>
  <text x="350" y="115" class="ll-title">Frontend</text>
  <text x="350" y="134" class="ll-sub">:ChatWidget.jsx</text>

  <rect x="500" y="90" width="200" height="58" rx="6" fill="#166534"/>
  <text x="600" y="115" class="ll-title">Backend</text>
  <text x="600" y="134" class="ll-sub">:chatbot.js (Strapi)</text>

  <rect x="760" y="90" width="180" height="58" rx="6" fill="#7c2d12"/>
  <text x="850" y="115" class="ll-title">VectorStore</text>
  <text x="850" y="134" class="ll-sub">:ChromaDB</text>

  <rect x="1000" y="90" width="200" height="58" rx="6" fill="#b91c1c"/>
  <text x="1100" y="115" class="ll-title">Gemini Embed</text>
  <text x="1100" y="134" class="ll-sub">:gemini-embedding-001</text>

  <rect x="1260" y="90" width="200" height="58" rx="6" fill="#be185d"/>
  <text x="1360" y="115" class="ll-title">Gemini Flash LLM</text>
  <text x="1360" y="134" class="ll-sub">:gemini-2.5-flash</text>

  <!-- ========== LIFELINE LINES ========== -->
  <g stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,5">
    <line x1="120"  y1="148" x2="120"  y2="970"/>
    <line x1="350"  y1="148" x2="350"  y2="970"/>
    <line x1="600"  y1="148" x2="600"  y2="970"/>
    <line x1="850"  y1="148" x2="850"  y2="970"/>
    <line x1="1100" y1="148" x2="1100" y2="970"/>
    <line x1="1360" y1="148" x2="1360" y2="970"/>
  </g>

  <!-- ========== ACTIVATION BARS ========== -->
  <rect x="345" y="180" width="10" height="730" fill="#bae6fd" stroke="#0369a1"/>
  <rect x="595" y="220" width="10" height="660" fill="#bbf7d0" stroke="#166534"/>
  <rect x="845" y="275" width="10" height="70"  fill="#fed7aa" stroke="#7c2d12"/>
  <rect x="845" y="440" width="10" height="110" fill="#fed7aa" stroke="#7c2d12"/>
  <rect x="1095" y="305" width="10" height="40"  fill="#fecaca" stroke="#b91c1c"/>
  <rect x="1355" y="760" width="10" height="60"  fill="#fbcfe8" stroke="#be185d"/>

  <!-- ========== MESSAGES ========== -->

  <!-- 1. User → Frontend: nhập câu hỏi -->
  <line x1="125" y1="195" x2="345" y2="195" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="130" y="189" class="msg-num">1.</text>
  <text x="150" y="189" class="msg-lbl">Nhập câu hỏi (vd: "Gợi ý tour Đà Lạt dưới 5 triệu")</text>

  <!-- 2. Frontend → Backend: POST /chatbot/chat -->
  <line x1="355" y1="235" x2="595" y2="235" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="360" y="229" class="msg-num">2.</text>
  <text x="380" y="229" class="msg-lbl">POST /api/chatbot/chat</text>
  <text x="380" y="248" class="note" fill="#475569">{ message, language: 'vi'|'en'|'zh', history: last 10 msgs }</text>

  <!-- 3. Backend → VectorStore: search(query, topK=5, lang) -->
  <line x1="605" y1="290" x2="845" y2="290" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="284" class="msg-num">3.</text>
  <text x="630" y="284" class="msg-lbl">vectorStore.search(query, topK=5, lang)</text>

  <!-- 4. VectorStore → Gemini Embed: embed query -->
  <line x1="855" y1="325" x2="1095" y2="325" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="860" y="319" class="msg-num">4.</text>
  <text x="880" y="319" class="msg-lbl">embedContent(query, taskType=RETRIEVAL_QUERY)</text>

  <!-- 5. Gemini Embed → VectorStore: vector[3072] -->
  <line x1="1095" y1="350" x2="855" y2="350" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="1090" y="344" class="msg-num" text-anchor="end">5.</text>
  <text x="1075" y="344" class="msg-lbl" text-anchor="end">queryVector[3072 chiều]</text>

  <!-- ========== ALT FRAME: fallback ngôn ngữ ========== -->
  <rect x="560" y="380" width="350" height="200" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="560" y="380" width="50" height="20" fill="#0f172a"/>
  <text x="585" y="395" class="frame-lbl" fill="#ffffff" text-anchor="middle">alt</text>
  <text x="620" y="395" class="frame-cond">[ có kết quả với lang = vi ]</text>

  <!-- 6. VectorStore truy vấn ChromaDB với lang -->
  <line x1="605" y1="420" x2="845" y2="420" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="414" class="msg-num">6.</text>
  <text x="630" y="414" class="msg-lbl">collection.query(vector, where: {lang})</text>

  <!-- 7. ChromaDB → VectorStore: chunks -->
  <line x1="845" y1="450" x2="605" y2="450" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="840" y="444" class="msg-num" text-anchor="end">7.</text>
  <text x="825" y="444" class="msg-lbl" text-anchor="end">contextChunks (5 tours)</text>

  <!-- Divider ALT/ELSE -->
  <line x1="560" y1="475" x2="910" y2="475" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="620" y="490" class="frame-cond">[ ngược lại — thử fallback chain: en → no filter ]</text>

  <!-- 6'. Retry với filter en -->
  <line x1="605" y1="515" x2="845" y2="515" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="509" class="msg-num">6'.</text>
  <text x="635" y="509" class="msg-lbl">query(vector, where: {lang:'en'})</text>

  <!-- 7'. Nếu vẫn rỗng → query không filter -->
  <line x1="845" y1="545" x2="605" y2="545" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="840" y="539" class="msg-num" text-anchor="end">7'.</text>
  <text x="825" y="539" class="msg-lbl" text-anchor="end">fallback chunks</text>

  <!-- 8. VectorStore → Backend: return chunks -->
  <line x1="845" y1="605" x2="605" y2="605" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="840" y="599" class="msg-num" text-anchor="end">8.</text>
  <text x="825" y="599" class="msg-lbl" text-anchor="end">contextChunks[] (metadata: tourName, slug, price, location)</text>

  <!-- 9. Backend: buildSystemPrompt (self) -->
  <path d="M 605,640 Q 680,640 680,665 Q 680,690 605,690" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="655" class="msg-num">9.</text>
  <text x="685" y="655" class="msg-lbl">buildSystemPrompt(lang, contextChunks)</text>
  <text x="685" y="670" class="note" fill="#475569">→ STRICT RULES + ngữ cảnh tour</text>

  <!-- 10. Backend → Gemini Flash: startChat(history) -->
  <line x1="605" y1="730" x2="1355" y2="730" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="724" class="msg-num">10.</text>
  <text x="640" y="724" class="msg-lbl">getGenerativeModel({ systemInstruction, history: dropLeadingModel(history) })</text>

  <!-- 11. Backend → Gemini Flash: sendMessage(query) -->
  <line x1="605" y1="775" x2="1355" y2="775" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="769" class="msg-num">11.</text>
  <text x="640" y="769" class="msg-lbl">chat.sendMessage(userMessage)</text>

  <!-- 12. Gemini → Backend: reply text -->
  <line x1="1355" y1="810" x2="605" y2="810" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="1350" y="804" class="msg-num" text-anchor="end">12.</text>
  <text x="1335" y="804" class="msg-lbl" text-anchor="end">result.response.text() — reply (có [tour-slug])</text>

  <!-- 13. Backend: extractSources (self) -->
  <path d="M 605,840 Q 680,840 680,860 Q 680,880 605,880" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="610" y="855" class="msg-num">13.</text>
  <text x="685" y="855" class="msg-lbl">extractSources(chunks, reply)</text>
  <text x="685" y="870" class="note" fill="#475569">tìm slug / tên tour được nhắc tới</text>

  <!-- 14. Backend → Frontend: {reply, sources} -->
  <line x1="595" y1="905" x2="355" y2="905" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="590" y="899" class="msg-num" text-anchor="end">14.</text>
  <text x="580" y="899" class="msg-lbl" text-anchor="end">200 { reply, sources: [{tourName, slug, price, location}] }</text>

  <!-- 15. Frontend → User: render chat bubble + tour links -->
  <line x1="345" y1="945" x2="125" y2="945" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="340" y="939" class="msg-num" text-anchor="end">15.</text>
  <text x="330" y="939" class="msg-lbl" text-anchor="end">Hiển thị câu trả lời + thẻ tour có clickable link /tours/[slug]</text>

  <!-- ========== NOTE: retry logic ========== -->
  <g>
    <polygon points="20,660 290,660 300,670 300,750 20,750" fill="#fef3c7" stroke="#92400e"/>
    <text x="30" y="680" class="note" font-weight="700">Note — Xử lý rate limit 429</text>
    <text x="30" y="696" class="note">Embedding có retry tối đa 5 lần</text>
    <text x="30" y="710" class="note">với exponential backoff. Batch</text>
    <text x="30" y="724" class="note">size = 5, delay 1s giữa mỗi lần.</text>
    <text x="30" y="738" class="note">(chỉ áp dụng offline indexing)</text>
  </g>
</svg>
