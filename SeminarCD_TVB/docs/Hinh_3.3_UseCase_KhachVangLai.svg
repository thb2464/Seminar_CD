<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title     { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle  { font-size: 13px; fill: #475569; }
      .actor-lbl { font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .ext-lbl   { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .uc-lbl    { font-size: 12px; fill: #0f172a; text-anchor: middle; }
      .uc-lbl-sm { font-size: 11px; fill: #0f172a; text-anchor: middle; }
      .sys-lbl   { font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .stereo    { font-size: 10px; fill: #475569; font-style: italic; text-anchor: middle; }
      .group-lbl { font-size: 12px; font-weight: 700; fill: #1e3a8a; letter-spacing: 1px; }
    </style>
    <symbol id="actor" viewBox="-30 0 60 80">
      <circle cx="0" cy="12" r="10" fill="#fef3c7" stroke="#0f172a" stroke-width="1.6"/>
      <line x1="0" y1="22" x2="0" y2="50" stroke="#0f172a" stroke-width="1.6"/>
      <line x1="-15" y1="32" x2="15" y2="32" stroke="#0f172a" stroke-width="1.6"/>
      <line x1="0" y1="50" x2="-12" y2="72" stroke="#0f172a" stroke-width="1.6"/>
      <line x1="0" y1="50" x2="12" y2="72" stroke="#0f172a" stroke-width="1.6"/>
    </symbol>
  </defs>

  <rect width="1300" height="900" fill="#f8fafc"/>

  <text x="650" y="40" text-anchor="middle" class="title">Hình 3.3: Sơ đồ Use Case chi tiết — Khách vãng lai (Guest)</text>
  <text x="650" y="62" text-anchor="middle" class="subtitle">Các chức năng mà người dùng chưa đăng nhập có thể sử dụng trên website TravelTVB</text>

  <!-- System boundary -->
  <rect x="260" y="100" width="900" height="750" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="710" y="128" text-anchor="middle" class="sys-lbl">Hệ thống TravelTVB</text>
  <line x1="280" y1="140" x2="1140" y2="140" stroke="#cbd5e1"/>

  <!-- Actor -->
  <use href="#actor" x="100" y="400" width="60" height="80"/>
  <text x="130" y="498" class="actor-lbl">Khách vãng lai</text>
  <text x="130" y="514" class="actor-lbl" font-weight="400" font-size="11">(Guest)</text>

  <!-- External: Gemini -->
  <rect x="1180" y="380" width="100" height="70" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1230" y="408" class="ext-lbl">«external»</text>
  <text x="1230" y="426" class="ext-lbl" font-size="11">Google</text>
  <text x="1230" y="440" class="ext-lbl" font-size="11">Gemini API</text>

  <!-- ======= GROUP 1: Duyệt nội dung Tour ======= -->
  <rect x="290" y="160" width="420" height="270" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/>
  <text x="310" y="180" class="group-lbl">1. DUYỆT NỘI DUNG TOUR</text>

  <ellipse cx="390" cy="220" rx="75" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="390" y="224" class="uc-lbl">Xem trang chủ</text>

  <ellipse cx="600" cy="220" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="600" y="224" class="uc-lbl">Duyệt danh sách tour</text>

  <ellipse cx="390" cy="290" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="390" y="294" class="uc-lbl">Lọc tour (giá, KV)</text>

  <ellipse cx="600" cy="290" rx="75" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="600" y="294" class="uc-lbl">Tìm kiếm tour</text>

  <ellipse cx="390" cy="360" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="390" y="364" class="uc-lbl">Xem chi tiết tour</text>

  <ellipse cx="600" cy="360" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="600" y="358" class="uc-lbl">Xem kiểm tra</text>
  <text x="600" y="372" class="uc-lbl">chỗ còn trống</text>

  <!-- include: Duyệt danh sách → Lọc -->
  <line x1="600" y1="244" x2="600" y2="266" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="600,264 596,258 604,258" fill="#475569"/>
  <text x="620" y="258" class="stereo" text-anchor="start">«extend»</text>

  <!-- include: Xem chi tiết → Xem kiểm tra -->
  <line x1="475" y1="360" x2="515" y2="360" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="513,360 507,356 507,364" fill="#475569"/>
  <text x="495" y="350" class="stereo">«include»</text>

  <!-- ======= GROUP 2: Đọc bài viết ======= -->
  <rect x="730" y="160" width="410" height="270" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/>
  <text x="750" y="180" class="group-lbl">2. ĐỌC BÀI VIẾT &amp; CỘNG ĐỒNG</text>

  <ellipse cx="830" cy="225" rx="80" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="830" y="229" class="uc-lbl">Xem tin thị trường</text>

  <ellipse cx="1040" cy="225" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="1040" y="229" class="uc-lbl">Xem bài tích hợp</text>

  <ellipse cx="830" cy="295" rx="80" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="830" y="299" class="uc-lbl">Xem podcast</text>

  <ellipse cx="1040" cy="295" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="1040" y="293" class="uc-lbl">Xem phân tích</text>
  <text x="1040" y="307" class="uc-lbl">bình luận</text>

  <ellipse cx="935" cy="375" rx="95" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="935" y="379" class="uc-lbl">Đọc chi tiết bài viết</text>

  <!-- ======= GROUP 3: Tương tác AI ======= -->
  <rect x="290" y="460" width="420" height="200" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/>
  <text x="310" y="480" class="group-lbl">3. TƯƠNG TÁC CHATBOT RAG</text>

  <ellipse cx="500" cy="520" rx="105" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="500" y="524" class="uc-lbl">Mở giao diện chatbot</text>

  <ellipse cx="400" cy="590" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="400" y="594" class="uc-lbl">Đặt câu hỏi về tour</text>

  <ellipse cx="600" cy="590" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="600" y="594" class="uc-lbl">Nhận gợi ý tour</text>

  <!-- extend: Đặt câu hỏi → Nhận gợi ý -->
  <line x1="490" y1="590" x2="515" y2="590" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="513,590 507,586 507,594" fill="#475569"/>
  <text x="502" y="580" class="stereo">«extend»</text>

  <!-- ======= GROUP 4: Đăng ký / Đăng nhập ======= -->
  <rect x="730" y="460" width="410" height="200" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/>
  <text x="750" y="480" class="group-lbl">4. TÀI KHOẢN</text>

  <ellipse cx="830" cy="520" rx="80" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="830" y="524" class="uc-lbl">Đăng ký tài khoản</text>

  <ellipse cx="1040" cy="520" rx="70" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="1040" y="524" class="uc-lbl">Đăng nhập</text>

  <ellipse cx="830" cy="595" rx="85" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="830" y="599" class="uc-lbl">Quên mật khẩu</text>

  <ellipse cx="1040" cy="595" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="1040" y="599" class="uc-lbl">Xác thực email</text>

  <!-- include: Đăng ký → Xác thực email -->
  <line x1="900" y1="525" x2="980" y2="585" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="978,585 974,579 982,580" fill="#475569"/>
  <text x="950" y="555" class="stereo">«include»</text>

  <!-- ======= GROUP 5: Phụ trợ ======= -->
  <rect x="290" y="690" width="850" height="140" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4,3"/>
  <text x="310" y="710" class="group-lbl">5. PHỤ TRỢ</text>

  <ellipse cx="400" cy="765" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="400" y="763" class="uc-lbl">Đổi ngôn ngữ</text>
  <text x="400" y="777" class="uc-lbl-sm">(vi / en / zh)</text>

  <ellipse cx="600" cy="765" rx="100" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="600" y="769" class="uc-lbl">Đăng ký nhận newsletter</text>

  <ellipse cx="810" cy="765" rx="90" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="810" y="769" class="uc-lbl">Xem trang Liên hệ</text>

  <ellipse cx="1010" cy="765" rx="95" ry="24" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="1010" y="769" class="uc-lbl">Xem trang Giới thiệu</text>

  <!-- ======= ACTOR ASSOCIATIONS ======= -->
  <g stroke="#1e3a8a" stroke-width="1.1" fill="none">
    <!-- Group 1 -->
    <line x1="160" y1="430" x2="315" y2="220"/>
    <line x1="160" y1="430" x2="510" y2="220"/>
    <line x1="160" y1="430" x2="305" y2="290"/>
    <line x1="160" y1="430" x2="525" y2="290"/>
    <line x1="160" y1="430" x2="305" y2="360"/>
    <!-- Group 2 -->
    <line x1="160" y1="435" x2="750" y2="225"/>
    <line x1="160" y1="435" x2="955" y2="225"/>
    <line x1="160" y1="435" x2="750" y2="295"/>
    <line x1="160" y1="435" x2="950" y2="295"/>
    <line x1="160" y1="440" x2="840" y2="375"/>
    <!-- Group 3 -->
    <line x1="160" y1="450" x2="395" y2="520"/>
    <line x1="160" y1="450" x2="310" y2="590"/>
    <!-- Group 4 -->
    <line x1="160" y1="450" x2="750" y2="520"/>
    <line x1="160" y1="450" x2="970" y2="520"/>
    <line x1="160" y1="460" x2="745" y2="595"/>
    <!-- Group 5 -->
    <line x1="160" y1="465" x2="310" y2="765"/>
    <line x1="160" y1="465" x2="500" y2="765"/>
    <line x1="160" y1="465" x2="720" y2="765"/>
    <line x1="160" y1="465" x2="915" y2="765"/>
  </g>

  <!-- Chatbot → Gemini (include) -->
  <line x1="605" y1="520" x2="1180" y2="408" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="900" y="455" class="stereo">«include» Gemini RAG</text>

  <!-- Legend -->
  <g transform="translate(1175, 500)">
    <rect width="110" height="330" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="10" y="20" font-size="11" font-weight="700">Chú thích</text>

    <ellipse cx="26" cy="50" rx="14" ry="8" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="46" y="54" font-size="10">Use case</text>

    <rect x="12" y="72" width="28" height="20" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="46" y="86" font-size="10">Hệ thống</text>
    <text x="46" y="98" font-size="10">ngoài</text>

    <line x1="12" y1="120" x2="40" y2="120" stroke="#0f172a" stroke-width="1.2"/>
    <text x="46" y="124" font-size="10">Association</text>

    <line x1="12" y1="148" x2="40" y2="148" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="46" y="152" font-size="10">«include»</text>
    <text x="46" y="164" font-size="10">«extend»</text>

    <text x="10" y="195" font-size="10" font-weight="700">Số use case: 19</text>

    <text x="10" y="220" font-size="10">• Duyệt tour: 6</text>
    <text x="10" y="236" font-size="10">• Bài viết: 5</text>
    <text x="10" y="252" font-size="10">• Chatbot: 3</text>
    <text x="10" y="268" font-size="10">• Tài khoản: 4</text>
    <text x="10" y="284" font-size="10">• Phụ trợ: 4</text>

    <text x="10" y="312" font-size="10" fill="#475569">(không cần</text>
    <text x="10" y="324" font-size="10" fill="#475569">đăng nhập)</text>
  </g>
</svg>
