<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title     { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle  { font-size: 13px; fill: #475569; }
      .ll-title  { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ll-sub    { font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
      .msg-lbl   { font-size: 12px; fill: #0f172a; }
      .msg-num   { font-size: 11px; font-weight: 700; fill: #1e3a8a; }
      .note      { font-size: 11px; fill: #334155; }
      .frame-lbl { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .frame-cond{ font-size: 11px; fill: #0f172a; font-style: italic; }
    </style>
    <marker id="sync" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#0f172a"/>
    </marker>
    <marker id="ret" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1300" height="880" fill="#f8fafc"/>

  <text x="650" y="36" text-anchor="middle" class="title">Hình 3.8: Sequence Diagram — Đăng nhập</text>
  <text x="650" y="58" text-anchor="middle" class="subtitle">Luồng tuần tự xác thực người dùng qua Strapi users-permissions plugin với JWT</text>

  <!-- ========== LIFELINE HEADS ========== -->
  <rect x="80" y="90" width="180" height="58" rx="6" fill="#1e3a8a"/>
  <text x="170" y="115" class="ll-title">Khách hàng</text>
  <text x="170" y="134" class="ll-sub">:User (Actor)</text>

  <rect x="360" y="90" width="200" height="58" rx="6" fill="#0369a1"/>
  <text x="460" y="115" class="ll-title">Frontend</text>
  <text x="460" y="134" class="ll-sub">:LoginPage.jsx</text>

  <rect x="660" y="90" width="240" height="58" rx="6" fill="#166534"/>
  <text x="780" y="115" class="ll-title">Backend — Strapi</text>
  <text x="780" y="134" class="ll-sub">:users-permissions plugin</text>

  <rect x="1000" y="90" width="200" height="58" rx="6" fill="#7c2d12"/>
  <text x="1100" y="115" class="ll-title">SQLite</text>
  <text x="1100" y="134" class="ll-sub">:up_users table</text>

  <!-- ========== LIFELINE LINES ========== -->
  <g stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,5">
    <line x1="170"  y1="148" x2="170"  y2="830"/>
    <line x1="460"  y1="148" x2="460"  y2="830"/>
    <line x1="780"  y1="148" x2="780"  y2="830"/>
    <line x1="1100" y1="148" x2="1100" y2="830"/>
  </g>

  <!-- ========== ACTIVATION BARS ========== -->
  <rect x="455" y="180" width="10" height="620" fill="#bae6fd" stroke="#0369a1"/>
  <rect x="775" y="260" width="10" height="480" fill="#bbf7d0" stroke="#166534"/>
  <rect x="1095" y="315" width="10" height="60" fill="#fed7aa" stroke="#7c2d12"/>

  <!-- ========== MESSAGES ========== -->

  <!-- 1. User → Frontend: nhập email + password -->
  <line x1="175" y1="195" x2="455" y2="195" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="180" y="189" class="msg-num">1.</text>
  <text x="200" y="189" class="msg-lbl">Nhập email / username + password → Click "Đăng nhập"</text>

  <!-- 2. Frontend: validate form (self) -->
  <path d="M 465,225 Q 540,225 540,245 Q 540,265 465,265" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="470" y="240" class="msg-num">2.</text>
  <text x="545" y="240" class="msg-lbl">Validate form (email không rỗng,</text>
  <text x="545" y="255" class="msg-lbl">độ dài password ≥ 6)</text>

  <!-- 3. Frontend → Backend: POST /api/auth/local -->
  <line x1="465" y1="290" x2="775" y2="290" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="470" y="284" class="msg-num">3.</text>
  <text x="490" y="284" class="msg-lbl">POST /api/auth/local</text>
  <text x="490" y="304" class="note" fill="#475569">{ identifier: email, password }</text>

  <!-- 4. Backend → SQLite: SELECT user -->
  <line x1="785" y1="335" x2="1095" y2="335" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="790" y="329" class="msg-num">4.</text>
  <text x="810" y="329" class="msg-lbl">SELECT * FROM up_users WHERE email = ? OR username = ?</text>

  <!-- 5. SQLite → Backend: user record -->
  <line x1="1095" y1="365" x2="785" y2="365" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="1090" y="359" class="msg-num" text-anchor="end">5.</text>
  <text x="1075" y="359" class="msg-lbl" text-anchor="end">user { id, email, password(hashed), confirmed, blocked, role_id }</text>

  <!-- 6. Backend: bcrypt.compare (self) -->
  <path d="M 785,395 Q 870,395 870,420 Q 870,445 785,445" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="790" y="412" class="msg-num">6.</text>
  <text x="875" y="412" class="msg-lbl">bcrypt.compare(password, user.password)</text>
  <text x="875" y="427" class="note" fill="#475569">Kiểm tra confirmed=true &amp; blocked=false</text>

  <!-- ========== ALT FRAME ========== -->
  <rect x="140" y="480" width="1120" height="280" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="140" y="480" width="50" height="20" fill="#0f172a"/>
  <text x="165" y="495" class="frame-lbl" fill="#ffffff" text-anchor="middle">alt</text>
  <text x="200" y="495" class="frame-cond">[ password hợp lệ &amp;&amp; confirmed &amp;&amp; !blocked ]</text>

  <!-- 7a. Backend generate JWT (self) -->
  <path d="M 785,520 Q 870,520 870,545 Q 870,570 785,570" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="790" y="537" class="msg-num">7.</text>
  <text x="875" y="537" class="msg-lbl">jwt.sign({ id: user.id }, APP_KEYS[0])</text>
  <text x="875" y="552" class="note" fill="#475569">expiresIn: 30d</text>

  <!-- 8a. Backend → Frontend: 200 {jwt, user} -->
  <line x1="775" y1="600" x2="465" y2="600" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="770" y="594" class="msg-num" text-anchor="end">8.</text>
  <text x="755" y="594" class="msg-lbl" text-anchor="end">200 OK { jwt, user: { id, email, username, role } }</text>

  <!-- 9a. Frontend: store jwt -->
  <path d="M 465,625 Q 540,625 540,645 Q 540,665 465,665" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="470" y="640" class="msg-num">9.</text>
  <text x="545" y="640" class="msg-lbl">localStorage.setItem('jwt', jwt)</text>
  <text x="545" y="655" class="note" fill="#475569">setUser(user) trong AuthContext</text>

  <!-- 10a. Frontend → User: redirect to / or /account -->
  <line x1="455" y1="690" x2="175" y2="690" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="450" y="684" class="msg-num" text-anchor="end">10.</text>
  <text x="440" y="684" class="msg-lbl" text-anchor="end">Chuyển hướng tới / (hoặc trang trước đó), hiển thị tên user</text>

  <!-- Divider ALT/ELSE -->
  <line x1="140" y1="710" x2="1260" y2="710" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="200" y="725" class="frame-cond">[ ngược lại — sai mật khẩu hoặc tài khoản bị khoá ]</text>

  <!-- 8b. Backend → Frontend: 400 error -->
  <line x1="775" y1="750" x2="465" y2="750" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="770" y="744" class="msg-num" text-anchor="end">8'.</text>
  <text x="755" y="744" class="msg-lbl" text-anchor="end">400 Bad Request { error: "Invalid identifier or password" }</text>

  <!-- 9b. Frontend → User: show error -->
  <line x1="455" y1="790" x2="175" y2="790" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="450" y="784" class="msg-num" text-anchor="end">9'.</text>
  <text x="440" y="784" class="msg-lbl" text-anchor="end">Hiển thị thông báo lỗi "Sai email hoặc mật khẩu"</text>

  <!-- ========== NOTE ========== -->
  <g>
    <polygon points="20,420 300,420 310,430 310,530 20,530" fill="#fef3c7" stroke="#92400e"/>
    <text x="30" y="440" class="note" font-weight="700">Note — Bảo mật</text>
    <text x="30" y="456" class="note">• Password lưu dạng hash bcrypt</text>
    <text x="30" y="470" class="note">  (cost factor = 10)</text>
    <text x="30" y="484" class="note">• JWT ký bằng HS256 với APP_KEYS</text>
    <text x="30" y="498" class="note">• Rate-limit: 5 lần sai liên tiếp</text>
    <text x="30" y="512" class="note">  → khoá tài khoản tạm thời</text>
    <text x="30" y="526" class="note">• JWT gửi qua Authorization header</text>
  </g>
</svg>
