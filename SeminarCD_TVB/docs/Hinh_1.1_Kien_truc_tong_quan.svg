<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Hình 1.1: Kiến trúc tổng quan hệ thống TravelTVB</text>

  <!-- ================= Actors ================= -->
  <!-- Customer -->
  <g transform="translate(130, 230)">
    <circle cx="0" cy="0" r="22" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <path d="M 0 22 L 0 70 M -26 40 L 26 40 M 0 70 L -22 108 M 0 70 L 22 108"
          stroke="#4338ca" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="0" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Khách hàng</text>
    <text x="0" y="158" text-anchor="middle" font-size="12" fill="#475569">(End user)</text>
  </g>

  <!-- Admin -->
  <g transform="translate(130, 460)">
    <circle cx="0" cy="0" r="22" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <path d="M 0 22 L 0 70 M -26 40 L 26 40 M 0 70 L -22 108 M 0 70 L 22 108"
          stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="0" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Quản trị viên</text>
    <text x="0" y="158" text-anchor="middle" font-size="12" fill="#475569">(Admin)</text>
  </g>

  <!-- ================= System Boundary ================= -->
  <rect x="320" y="160" width="460" height="400" rx="14"
        fill="#f8fafc" stroke="#0f172a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="550" y="195" text-anchor="middle" font-size="15" font-weight="700"
        fill="#0f172a" letter-spacing="1.5">HỆ THỐNG TRAVELTVB</text>

  <!-- Inner system box -->
  <rect x="380" y="275" width="340" height="180" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="550" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Website TravelTVB</text>
  <line x1="410" y1="335" x2="690" y2="335" stroke="#60a5fa" stroke-width="1"/>
  <text x="550" y="362" text-anchor="middle" font-size="13" fill="#dbeafe">Đặt tour du lịch trực tuyến</text>
  <text x="550" y="384" text-anchor="middle" font-size="13" fill="#dbeafe">Trợ lý ảo AI (RAG Chatbot)</text>
  <text x="550" y="406" text-anchor="middle" font-size="13" fill="#dbeafe">Quản trị nội dung (Headless CMS)</text>
  <text x="550" y="428" text-anchor="middle" font-size="13" fill="#dbeafe">Đa ngôn ngữ (vi / en / zh)</text>

  <!-- ================= External Services ================= -->
  <!-- VNPay -->
  <g>
    <rect x="880" y="215" width="260" height="110" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="1010" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">VNPay Sandbox</text>
    <text x="1010" y="276" text-anchor="middle" font-size="13" fill="#7c2d12">Cổng thanh toán điện tử</text>
    <text x="1010" y="302" text-anchor="middle" font-size="12" fill="#9a3412" font-style="italic">(External service)</text>
  </g>

  <!-- Google Gemini -->
  <g>
    <rect x="880" y="395" width="260" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="1010" y="430" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">Google Gemini API</text>
    <text x="1010" y="456" text-anchor="middle" font-size="13" fill="#064e3b">Embedding + LLM (RAG)</text>
    <text x="1010" y="482" text-anchor="middle" font-size="12" fill="#065f46" font-style="italic">(External service)</text>
  </g>

  <!-- ================= Arrows ================= -->
  <!-- Customer -> System -->
  <line x1="175" y1="245" x2="315" y2="310" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="238" text-anchor="middle" font-size="13" fill="#1e293b">Duyệt, đặt tour, chat</text>
  <text x="245" y="256" text-anchor="middle" font-size="11" fill="#64748b">HTTPS</text>

  <!-- Admin -> System -->
  <line x1="175" y1="475" x2="315" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="490" text-anchor="middle" font-size="13" fill="#1e293b">Quản trị nội dung &amp; đơn hàng</text>
  <text x="245" y="508" text-anchor="middle" font-size="11" fill="#64748b">Strapi Admin Panel</text>

  <!-- System -> VNPay -->
  <line x1="785" y1="248" x2="876" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="240" text-anchor="middle" font-size="12" fill="#1e293b">Tạo URL thanh toán</text>

  <!-- VNPay -> System -->
  <line x1="876" y1="290" x2="785" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="308" text-anchor="middle" font-size="12" fill="#1e293b">IPN / Return URL</text>

  <!-- System -> Gemini -->
  <line x1="785" y1="428" x2="876" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="420" text-anchor="middle" font-size="12" fill="#1e293b">Query + context</text>

  <!-- Gemini -> System -->
  <line x1="876" y1="470" x2="785" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="488" text-anchor="middle" font-size="12" fill="#1e293b">Embedding / Response</text>

  <!-- ================= Legend ================= -->
  <g transform="translate(250, 650)">
    <circle cx="15" cy="-4" r="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="30" y="0" font-size="12" fill="#1e293b">Tác nhân (Actor)</text>

    <rect x="170" y="-11" width="14" height="14" fill="#2563eb"/>
    <text x="190" y="0" font-size="12" fill="#1e293b">Hệ thống đang xây dựng</text>

    <rect x="385" y="-11" width="14" height="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="405" y="0" font-size="12" fill="#1e293b">Dịch vụ bên thứ ba</text>

    <line x1="575" y1="-4" x2="615" y2="-4" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="625" y="0" font-size="12" fill="#1e293b">Luồng tương tác / dữ liệu</text>

    <rect x="835" y="-13" width="20" height="16" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="861" y="0" font-size="12" fill="#1e293b">Biên hệ thống</text>
  </g>
</svg>
