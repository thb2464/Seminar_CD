<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="1400" height="1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title     { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle  { font-size: 13px; fill: #475569; }
      .ll-title  { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ll-sub    { font-size: 11px; fill: #e2e8f0; text-anchor: middle; }
      .msg-lbl   { font-size: 12px; fill: #0f172a; }
      .msg-num   { font-size: 11px; font-weight: 700; fill: #1e3a8a; }
      .note      { font-size: 11px; fill: #334155; }
      .frame-lbl { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .frame-cond{ font-size: 11px; fill: #0f172a; font-style: italic; }
    </style>
    <marker id="sync" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#0f172a"/>
    </marker>
    <marker id="ret" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1400" height="1020" fill="#f8fafc"/>

  <text x="700" y="36" text-anchor="middle" class="title">Hình 3.6: Sequence Diagram — Đặt tour và thanh toán VNPay</text>
  <text x="700" y="58" text-anchor="middle" class="subtitle">Luồng tuần tự 13 bước giữa Khách hàng, Frontend React, Strapi Backend, VNPay Sandbox và SQLite</text>

  <!-- ========== LIFELINE HEADS ========== -->
  <!-- Customer -->
  <rect x="60" y="90" width="170" height="58" rx="6" fill="#1e3a8a"/>
  <text x="145" y="115" class="ll-title">Khách hàng</text>
  <text x="145" y="134" class="ll-sub">:Customer (Actor)</text>

  <!-- Frontend -->
  <rect x="300" y="90" width="180" height="58" rx="6" fill="#0369a1"/>
  <text x="390" y="115" class="ll-title">Frontend</text>
  <text x="390" y="134" class="ll-sub">:React (BookingPage)</text>

  <!-- Backend -->
  <rect x="560" y="90" width="200" height="58" rx="6" fill="#166534"/>
  <text x="660" y="115" class="ll-title">Backend</text>
  <text x="660" y="134" class="ll-sub">:Strapi — booking.js</text>

  <!-- VNPay -->
  <rect x="840" y="90" width="180" height="58" rx="6" fill="#b91c1c"/>
  <text x="930" y="115" class="ll-title">VNPay Sandbox</text>
  <text x="930" y="134" class="ll-sub">:Payment Gateway</text>

  <!-- SQLite -->
  <rect x="1100" y="90" width="180" height="58" rx="6" fill="#7c2d12"/>
  <text x="1190" y="115" class="ll-title">SQLite</text>
  <text x="1190" y="134" class="ll-sub">:bookings table</text>

  <!-- ========== LIFELINE LINES ========== -->
  <g stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,5">
    <line x1="145"  y1="148" x2="145"  y2="970"/>
    <line x1="390"  y1="148" x2="390"  y2="970"/>
    <line x1="660"  y1="148" x2="660"  y2="970"/>
    <line x1="930"  y1="148" x2="930"  y2="970"/>
    <line x1="1190" y1="148" x2="1190" y2="970"/>
  </g>

  <!-- ========== ACTIVATION BARS ========== -->
  <!-- Frontend activation -->
  <rect x="385" y="180" width="10" height="420" fill="#bae6fd" stroke="#0369a1"/>
  <rect x="385" y="830" width="10" height="120" fill="#bae6fd" stroke="#0369a1"/>

  <!-- Backend activation (create-payment-url) -->
  <rect x="655" y="220" width="10" height="280" fill="#bbf7d0" stroke="#166534"/>
  <!-- Backend activation (vnpay-return) -->
  <rect x="655" y="700" width="10" height="200" fill="#bbf7d0" stroke="#166534"/>

  <!-- VNPay activation -->
  <rect x="925" y="570" width="10" height="140" fill="#fecaca" stroke="#b91c1c"/>

  <!-- ========== MESSAGES ========== -->

  <!-- 1. Customer → Frontend: chọn tour + điền thông tin -->
  <line x1="148" y1="190" x2="385" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="150" y="184" class="msg-num">1.</text>
  <text x="170" y="184" class="msg-lbl">Chọn tour, ngày khởi hành, số khách, nhập contact info</text>

  <!-- 2. Frontend → Backend: POST /bookings/create-payment-url -->
  <line x1="395" y1="230" x2="655" y2="230" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="397" y="224" class="msg-num">2.</text>
  <text x="415" y="224" class="msg-lbl">POST /api/bookings/create-payment-url</text>
  <text x="415" y="244" class="note" fill="#475569">{ tourId, travelDate, adultCount, childCount, contactName/email/phone }</text>

  <!-- 3. Backend: kiểm tra availability + tính total_price (self-call) -->
  <path d="M 665,275 Q 720,275 720,295 Q 720,315 665,315" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="290" class="msg-num">3.</text>
  <text x="725" y="290" class="msg-lbl">Validate + tính total_price</text>
  <text x="725" y="305" class="note" fill="#475569">(adult × price + child × child_price)</text>

  <!-- 4. Backend → SQLite: INSERT booking status=Pending -->
  <line x1="665" y1="345" x2="1185" y2="345" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="339" class="msg-num">4.</text>
  <text x="690" y="339" class="msg-lbl">INSERT INTO bookings (status='Pending', total_price, user_id, tour_id, …)</text>

  <!-- 5. SQLite → Backend: booking.id -->
  <line x1="1185" y1="375" x2="670" y2="375" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="1100" y="369" class="msg-num" text-anchor="end">5.</text>
  <text x="1080" y="369" class="msg-lbl" text-anchor="end">bookingId (PK mới)</text>

  <!-- 6. Backend: tạo txnRef + ký HMAC-SHA512 (self-call) -->
  <path d="M 665,405 Q 740,405 740,430 Q 740,455 665,455" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="420" class="msg-num">6.</text>
  <text x="745" y="420" class="msg-lbl">Tạo txnRef = `${id}_${Date.now()}`</text>
  <text x="745" y="435" class="msg-lbl">Ký HMAC-SHA512(params, VNPAY_HASH_SECRET)</text>
  <text x="745" y="450" class="note" fill="#475569">→ payment URL (sandbox.vnpayment.vn)</text>

  <!-- 7. Backend → Frontend: paymentUrl -->
  <line x1="655" y1="485" x2="395" y2="485" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="650" y="479" class="msg-num" text-anchor="end">7.</text>
  <text x="645" y="479" class="msg-lbl" text-anchor="end">{ paymentUrl }</text>

  <!-- 8. Frontend → Customer: redirect -->
  <line x1="385" y1="525" x2="150" y2="525" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="385" y="519" class="msg-num" text-anchor="end">8.</text>
  <text x="378" y="519" class="msg-lbl" text-anchor="end">window.location = paymentUrl (redirect)</text>

  <!-- 9. Customer → VNPay: nhập thông tin thẻ + OTP -->
  <line x1="150" y1="580" x2="925" y2="580" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="155" y="574" class="msg-num">9.</text>
  <text x="175" y="574" class="msg-lbl">Nhập thông tin thẻ / tài khoản ngân hàng + OTP</text>

  <!-- 10. VNPay → Backend: GET /vnpay-return (IPN callback) -->
  <line x1="925" y1="640" x2="665" y2="640" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="920" y="634" class="msg-num" text-anchor="end">10.</text>
  <text x="910" y="634" class="msg-lbl" text-anchor="end">GET /api/bookings/vnpay-return?vnp_TxnRef=…&amp;vnp_ResponseCode=…&amp;vnp_SecureHash=…</text>

  <!-- 11. Backend: verify signature HMAC (self) -->
  <path d="M 665,720 Q 740,720 740,745 Q 740,770 665,770" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="735" class="msg-num">11.</text>
  <text x="745" y="735" class="msg-lbl">Xác minh chữ ký HMAC-SHA512</text>
  <text x="745" y="750" class="note" fill="#475569">So sánh hash nhận được với hash tự tính</text>

  <!-- ========== ALT FRAME ========== -->
  <rect x="600" y="790" width="660" height="160" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="600" y="790" width="50" height="20" fill="#0f172a"/>
  <text x="625" y="805" class="frame-lbl" fill="#ffffff" text-anchor="middle">alt</text>
  <text x="660" y="805" class="frame-cond">[ vnp_ResponseCode = '00' &amp;&amp; chữ ký hợp lệ ]</text>

  <!-- 12a. Backend → SQLite: UPDATE status=Paid -->
  <line x1="665" y1="830" x2="1185" y2="830" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="824" class="msg-num">12.</text>
  <text x="700" y="824" class="msg-lbl">UPDATE bookings SET status='Paid', vnpay_transaction_no=? WHERE id=?</text>

  <!-- Divider ALT/ELSE -->
  <line x1="600" y1="870" x2="1260" y2="870" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="660" y="884" class="frame-cond">[ ngược lại — thanh toán thất bại ]</text>

  <!-- 12b. Backend → SQLite: UPDATE status=Failed (only if current=Pending) -->
  <line x1="665" y1="910" x2="1185" y2="910" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sync)"/>
  <text x="670" y="904" class="msg-num">12'.</text>
  <text x="705" y="904" class="msg-lbl">UPDATE bookings SET status='Failed' WHERE id=? AND status='Pending'</text>

  <!-- 13. Backend → Frontend: redirect success/failure -->
  <line x1="655" y1="985" x2="395" y2="985" stroke="#0f172a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ret)"/>
  <text x="650" y="975" class="msg-num" text-anchor="end">13.</text>
  <text x="645" y="975" class="msg-lbl" text-anchor="end">302 Redirect → /booking/success?id=… hoặc /booking/failure?id=…</text>

  <!-- ========== NOTE: Idempotency ========== -->
  <g>
    <polygon points="30,790 250,790 260,800 260,870 30,870" fill="#fef3c7" stroke="#92400e"/>
    <text x="40" y="810" class="note" font-weight="700">Note — Idempotency</text>
    <text x="40" y="826" class="note">Chỉ chuyển sang 'Paid' khi</text>
    <text x="40" y="840" class="note">status ≠ 'Paid' &amp; ≠ 'Cancelled'.</text>
    <text x="40" y="854" class="note">Chỉ chuyển sang 'Failed' khi</text>
    <text x="40" y="866" class="note">status hiện tại = 'Pending'.</text>
  </g>
</svg>
