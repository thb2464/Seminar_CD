<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 970" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="970" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Quy trình hoạt động của RAG Pipeline</text>

  <!-- ================= PHASE 1 ================= -->
  <text x="100" y="100" font-size="16" font-weight="700" fill="#0369a1" letter-spacing="0.5">GIAI ĐOẠN 1 — LẬP CHỈ MỤC DỮ LIỆU (OFFLINE)</text>
  <text x="100" y="122" font-size="12" fill="#64748b" font-style="italic">Chạy định kỳ khi Admin thêm / sửa tour · Script: indexTours.js</text>

  <!-- P1 Box 1: Strapi -->
  <g>
    <rect x="100" y="150" width="260" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="230" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">1. Strapi CMS</text>
    <text x="230" y="208" text-anchor="middle" font-size="12" fill="#4c1d95">GET /api/tours?locale=...</text>
    <text x="230" y="230" text-anchor="middle" font-size="12" fill="#4c1d95">3 locales: vi / en / zh</text>
    <text x="230" y="258" text-anchor="middle" font-size="11" fill="#6b21a8" font-style="italic">Nguồn dữ liệu tour</text>
  </g>
  <line x1="362" y1="215" x2="398" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P1 Box 2: Chunking -->
  <g>
    <rect x="400" y="150" width="260" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="530" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2. Chunking</text>
    <text x="530" y="205" text-anchor="middle" font-size="12" fill="#334155">indexTours.js</text>
    <text x="530" y="227" text-anchor="middle" font-size="11" fill="#334155">Tour → {overview, description,</text>
    <text x="530" y="244" text-anchor="middle" font-size="11" fill="#334155">highlights, itinerary}</text>
    <text x="530" y="266" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">Tách thành đoạn ngắn</text>
  </g>
  <line x1="662" y1="215" x2="698" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P1 Box 3: Gemini embedding -->
  <g>
    <rect x="700" y="150" width="260" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="830" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">3. Google Gemini</text>
    <text x="830" y="205" text-anchor="middle" font-size="13" fill="#064e3b">gemini-embedding-001</text>
    <text x="830" y="227" text-anchor="middle" font-size="11" fill="#065f46">Vector 3072 chiều / chunk</text>
    <text x="830" y="262" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">Batch 5, delay 1s (15 RPM)</text>
  </g>
  <line x1="962" y1="215" x2="998" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P1 Box 4: ChromaDB -->
  <g>
    <rect x="1000" y="150" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="1130" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">4. ChromaDB</text>
    <text x="1130" y="205" text-anchor="middle" font-size="12" fill="#7c2d12">Collection: tour_embeddings</text>
    <text x="1130" y="227" text-anchor="middle" font-size="11" fill="#7c2d12">upsert(id, vector, metadata)</text>
    <text x="1130" y="262" text-anchor="middle" font-size="11" fill="#9a3412" font-style="italic">{language, tourSlug, …}</text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="325" x2="1320" y2="325" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ================= PHASE 2 ================= -->
  <text x="100" y="365" font-size="16" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">GIAI ĐOẠN 2 — XỬ LÝ TRUY VẤN (ONLINE / RUNTIME)</text>
  <text x="100" y="387" font-size="12" fill="#64748b" font-style="italic">Mỗi khi người dùng gửi câu hỏi · Service: chatbot.js · Endpoint: POST /api/chatbot/query</text>

  <!-- P2 Row 1 Box 1: User -->
  <g>
    <rect x="100" y="415" width="260" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="230" y="445" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">1. Người dùng</text>
    <text x="230" y="473" text-anchor="middle" font-size="12" fill="#78350f">Gửi câu hỏi + ngôn ngữ</text>
    <text x="230" y="493" text-anchor="middle" font-size="12" fill="#78350f">+ lịch sử hội thoại</text>
    <text x="230" y="523" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">POST /api/chatbot/query</text>
  </g>
  <line x1="362" y1="480" x2="398" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 1 Box 2: Embed query -->
  <g>
    <rect x="400" y="415" width="260" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="530" y="445" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">2. Nhúng câu hỏi</text>
    <text x="530" y="473" text-anchor="middle" font-size="12" fill="#064e3b">gemini-embedding-001</text>
    <text x="530" y="493" text-anchor="middle" font-size="11" fill="#065f46">embed(message)</text>
    <text x="530" y="523" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">→ vector 3072 chiều</text>
  </g>
  <line x1="662" y1="480" x2="698" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 1 Box 3: Search ChromaDB -->
  <g>
    <rect x="700" y="415" width="260" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="830" y="445" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">3. Tìm kiếm ngữ nghĩa</text>
    <text x="830" y="473" text-anchor="middle" font-size="12" fill="#7c2d12">ChromaDB.query()</text>
    <text x="830" y="493" text-anchor="middle" font-size="11" fill="#7c2d12">top-5, filter by language</text>
    <text x="830" y="523" text-anchor="middle" font-size="11" fill="#9a3412" font-style="italic">fallback: en → no filter</text>
  </g>
  <line x1="962" y1="480" x2="998" y2="480" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 1 Box 4: Retrieved chunks -->
  <g>
    <rect x="1000" y="415" width="260" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="1130" y="445" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4. Top-5 chunks</text>
    <text x="1130" y="473" text-anchor="middle" font-size="11" fill="#334155">Content + metadata:</text>
    <text x="1130" y="493" text-anchor="middle" font-size="11" fill="#334155">{tourName, tourSlug, price,</text>
    <text x="1130" y="510" text-anchor="middle" font-size="11" fill="#334155">location, language}</text>
  </g>

  <!-- Down arrow from P2 Row 1 to Row 2 -->
  <path d="M 1130 547 L 1130 595" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- P2 Row 2 Box 5: Build prompt -->
  <g>
    <rect x="1000" y="615" width="260" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="1130" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5. Xây prompt</text>
    <text x="1130" y="673" text-anchor="middle" font-size="11" fill="#334155">buildSystemPrompt():</text>
    <text x="1130" y="693" text-anchor="middle" font-size="11" fill="#334155">Strict rules + context +</text>
    <text x="1130" y="710" text-anchor="middle" font-size="11" fill="#334155">history (last 10 msgs)</text>
  </g>
  <line x1="998" y1="680" x2="962" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 2 Box 6: LLM -->
  <g>
    <rect x="700" y="615" width="260" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="830" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">6. Sinh câu trả lời</text>
    <text x="830" y="673" text-anchor="middle" font-size="13" fill="#064e3b">gemini-2.5-flash</text>
    <text x="830" y="695" text-anchor="middle" font-size="11" fill="#065f46">Grounded generation</text>
    <text x="830" y="725" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">theo TOUR DATA CONTEXT</text>
  </g>
  <line x1="698" y1="680" x2="662" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 2 Box 7: Extract sources -->
  <g>
    <rect x="400" y="615" width="260" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="530" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">7. Trích nguồn</text>
    <text x="530" y="673" text-anchor="middle" font-size="11" fill="#334155">extractSources():</text>
    <text x="530" y="693" text-anchor="middle" font-size="11" fill="#334155">Đối chiếu slug &amp; tên tour</text>
    <text x="530" y="710" text-anchor="middle" font-size="11" fill="#334155">xuất hiện trong reply</text>
  </g>
  <line x1="398" y1="680" x2="362" y2="680" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P2 Row 2 Box 8: Response -->
  <g>
    <rect x="100" y="615" width="260" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="230" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">8. Trả kết quả</text>
    <text x="230" y="673" text-anchor="middle" font-size="12" fill="#78350f">{ reply, sources }</text>
    <text x="230" y="695" text-anchor="middle" font-size="11" fill="#78350f">ChatbotWidget hiển thị</text>
    <text x="230" y="725" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">→ Người dùng</text>
  </g>

  <!-- Dashed loop-back arrow from box 8 up to box 1 -->
  <path d="M 230 613 C 230 580, 230 580, 230 547" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ================= Notes ================= -->
  <g transform="translate(100, 815)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Ghi chú thiết kế:</text>
    <text x="0" y="24" font-size="12" fill="#334155">• Strict prompt rules: chatbot CHỈ trả lời dựa trên context truy xuất được — tránh "hallucination" (bịa thông tin).</text>
    <text x="0" y="44" font-size="12" fill="#334155">• Fallback tìm kiếm: ưu tiên ngôn ngữ người dùng → thử 'en' → cuối cùng bỏ bộ lọc ngôn ngữ để vẫn có kết quả.</text>
    <text x="0" y="64" font-size="12" fill="#334155">• Ngữ cảnh đa lượt: giữ tối đa 10 tin nhắn gần nhất (5 cặp) để chatbot nhớ nội dung hội thoại trước đó.</text>
    <text x="0" y="84" font-size="12" fill="#334155">• Rate limit: Gemini embedding giới hạn 15 RPM (free tier) → batch 5 chunk, retry 5× khi HTTP 429.</text>
  </g>
</svg>
