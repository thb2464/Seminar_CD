<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Luồng thanh toán VNPay</text>

  <!-- ================= Actor headers ================= -->
  <!-- User / Frontend -->
  <rect x="80" y="70" width="220" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Người dùng</text>
  <text x="190" y="118" text-anchor="middle" font-size="12" fill="#92400e">(React Frontend)</text>

  <!-- Backend -->
  <rect x="460" y="70" width="220" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="570" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Strapi Backend</text>
  <text x="570" y="118" text-anchor="middle" font-size="12" fill="#1e40af">(booking controller)</text>

  <!-- VNPay -->
  <rect x="840" y="70" width="220" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="950" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">VNPay Sandbox</text>
  <text x="950" y="118" text-anchor="middle" font-size="12" fill="#9a3412">(External gateway)</text>

  <!-- Database -->
  <rect x="1190" y="70" width="190" height="60" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="1285" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SQLite</text>
  <text x="1285" y="118" text-anchor="middle" font-size="12" fill="#334155">(bookings table)</text>

  <!-- ================= Lifelines (dashed) ================= -->
  <line x1="190" y1="130" x2="190" y2="1040" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="570" y1="130" x2="570" y2="1040" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="950" y1="130" x2="950" y2="1040" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="1285" y1="130" x2="1285" y2="1040" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- ================= Messages ================= -->

  <!-- 1. Self note on User -->
  <path d="M 190 155 C 260 155, 260 180, 195 180" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="165" font-size="12" fill="#1e293b">1. Điền form đặt tour &amp; nhấn "Thanh toán"</text>

  <!-- 2. User -> Backend: POST /api/bookings -->
  <line x1="192" y1="215" x2="568" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">2. POST /api/bookings</text>
  <text x="380" y="225" text-anchor="middle" font-size="11" fill="#475569">{tour, travel_date, adult_count, child_count, contact_*}</text>

  <!-- 3. Backend -> DB: INSERT booking -->
  <line x1="572" y1="260" x2="1283" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">3. INSERT booking (status='Pending', payment_ref)</text>

  <!-- 4. DB -> Backend (return) -->
  <line x1="1283" y1="290" x2="572" y2="290" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpen)"/>
  <text x="928" y="304" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">4. Trả về {id, payment_ref}</text>

  <!-- 5. Backend -> User (return) -->
  <line x1="568" y1="330" x2="192" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpen)"/>
  <text x="380" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">5. 201 Created: {id, total_price, payment_ref}</text>

  <!-- 6. User -> Backend: create-payment-url -->
  <line x1="192" y1="380" x2="568" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">6. POST /api/bookings/create-payment-url</text>
  <text x="380" y="390" text-anchor="middle" font-size="11" fill="#475569">{bookingId}</text>

  <!-- 7. Backend self-action: validate + sign -->
  <path d="M 570 418 C 640 418, 640 452, 575 452" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="645" y="425" font-size="12" font-weight="600" fill="#1e293b">7. Xác thực ownership &amp; status ∈ {Pending, Failed}</text>
  <text x="645" y="442" font-size="12" fill="#334155">Kiểm tra travel_date chưa qua</text>
  <text x="645" y="459" font-size="12" font-weight="600" fill="#1e293b">Ký HMAC-SHA512 với VNPAY_HASH_SECRET</text>

  <!-- 8. Backend -> DB: UPDATE payment_ref -->
  <line x1="572" y1="490" x2="1283" y2="490" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="483" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">8. UPDATE payment_ref = txnRef (bookingId_timestamp)</text>

  <!-- 9. Backend -> User: return paymentUrl -->
  <line x1="568" y1="525" x2="192" y2="525" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpen)"/>
  <text x="380" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">9. 200 OK: {paymentUrl}</text>

  <!-- 10. User self: redirect -->
  <path d="M 190 553 C 260 553, 260 580, 195 580" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="565" font-size="12" fill="#1e293b">10. window.location = paymentUrl → chuyển hướng VNPay</text>

  <!-- 11. User -> VNPay -->
  <line x1="192" y1="610" x2="948" y2="610" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="603" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">11. GET {paymentUrl}?vnp_Amount=…&amp;vnp_SecureHash=…</text>

  <!-- 12. VNPay self: user completes payment -->
  <path d="M 950 638 C 1030 638, 1030 668, 955 668" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1040" y="645" font-size="12" font-weight="600" fill="#1e293b">12. Người dùng hoàn tất thanh toán</text>
  <text x="1040" y="662" font-size="11" fill="#475569">(ATM / Visa / QR / Internet Banking)</text>

  <!-- 13. VNPay -> Backend: callback -->
  <line x1="948" y1="705" x2="572" y2="705" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="698" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">13. GET /api/bookings/vnpay-return</text>
  <text x="760" y="715" text-anchor="middle" font-size="11" fill="#475569">?vnp_ResponseCode, vnp_TxnRef, vnp_TransactionNo, vnp_SecureHash</text>

  <!-- 14. Backend self: verify checksum -->
  <path d="M 570 745 C 640 745, 640 775, 575 775" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="645" y="752" font-size="12" font-weight="600" fill="#1e293b">14. Xác thực chữ ký: tính lại HMAC-SHA512</text>
  <text x="645" y="769" font-size="12" fill="#334155">→ so khớp với vnp_SecureHash gửi về</text>

  <!-- ================= ALT fragment ================= -->
  <rect x="150" y="800" width="1140" height="210" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <!-- ALT label -->
  <rect x="150" y="800" width="50" height="22" fill="#0f172a"/>
  <text x="175" y="816" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">alt</text>

  <!-- Guard 1 -->
  <text x="210" y="816" font-size="12" font-style="italic" fill="#0f172a">[checksum hợp lệ ∧ vnp_ResponseCode = "00"]</text>

  <!-- 15a. Backend -> DB: UPDATE Paid -->
  <line x1="572" y1="848" x2="1283" y2="848" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="841" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">15a. UPDATE status='Paid', vnpay_transaction_no (idempotent)</text>

  <!-- 16a. Backend -> User redirect success -->
  <line x1="568" y1="885" x2="192" y2="885" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="878" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">16a. 302 Redirect: /payment-return?status=success&amp;bookingId=…</text>

  <!-- Divider within ALT -->
  <line x1="150" y1="910" x2="1290" y2="910" stroke="#0f172a" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Guard 2 -->
  <text x="170" y="928" font-size="12" font-style="italic" fill="#0f172a">[checksum lỗi ∨ vnp_ResponseCode ≠ "00"]</text>

  <!-- 15b. Backend -> DB: UPDATE Failed -->
  <line x1="572" y1="955" x2="1283" y2="955" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="928" y="948" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">15b. UPDATE status='Failed' (chỉ khi đang Pending)</text>

  <!-- 16b. Backend -> User redirect failed -->
  <line x1="568" y1="990" x2="192" y2="990" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="983" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">16b. 302 Redirect: /payment-return?status=failed&amp;reason=…</text>

  <!-- 17. User self: show PaymentReturn page -->
  <path d="M 190 1028 C 260 1028, 260 1055, 195 1055" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="1040" font-size="12" fill="#1e293b">17. PaymentReturn.jsx hiển thị kết quả thanh toán cho người dùng</text>
</svg>
