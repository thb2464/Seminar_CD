name: travel-tvb

services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-tvb-postgres
    environment:
      POSTGRES_USER: travel_tvb_admin
      POSTGRES_PASSWORD: travel_tvb_admin
      POSTGRES_DB: travel_tvb_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_tvb_admin -d travel_tvb_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-tvb-local

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: travel-tvb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-tvb-local

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: travel-tvb-chromadb
    ports:
      - "8800:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - travel-tvb-local

  redis:
    image: redis:7.4-alpine
    container_name: travel-tvb-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-tvb-local

  kong:
    image: kong:3.7-alpine
    container_name: travel-tvb-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../services/api-gateway/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-tvb-local

volumes:
  postgres-data:
  rabbitmq-data:
  chroma-data:
  redis-data:

networks:
  travel-tvb-local:
    name: travel-tvb-local
