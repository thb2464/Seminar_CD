# Travel TVB production API cutover.
#
# Install this file as an Nginx server block on the public reverse proxy host
# after Kong is reachable on 127.0.0.1:8000 or update the upstream address to
# the private Kong load balancer. This config intentionally has no Strapi
# upstream; the production API hostname must terminate at Kong only.

upstream travel_tvb_kong_proxy {
  server 127.0.0.1:8000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.travel-tvb.example.com srv1488417.hstgr.cloud;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.travel-tvb.example.com srv1488417.hstgr.cloud;

  ssl_certificate /etc/letsencrypt/live/api.travel-tvb.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.travel-tvb.example.com/privkey.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://travel_tvb_kong_proxy;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Trace-Id $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}

