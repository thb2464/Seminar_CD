apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: maintenance
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: travel-tvb
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: travel-tvb
        spec:
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
          initContainers:
            - name: dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command: ["/scripts/postgres-backup.sh"]
              envFrom:
                - configMapRef:
                    name: backup-config
                - secretRef:
                    name: backup-target-secret
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: upload
              image: amazon/aws-cli:2.15.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  backup_id="$(ls /backup/postgres | sort | tail -n 1)"
                  aws s3 sync "/backup/postgres/${backup_id}" "s3://${S3_BUCKET}/${BACKUP_PREFIX}/postgres/${backup_id}"
              envFrom:
                - configMapRef:
                    name: backup-config
                - secretRef:
                    name: backup-target-secret
              volumeMounts:
                - name: backup
                  mountPath: /backup
