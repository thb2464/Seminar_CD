apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: maintenance
  labels:
    app.kubernetes.io/name: postgres-restore
    app.kubernetes.io/part-of: travel-tvb
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-restore
        app.kubernetes.io/part-of: travel-tvb
    spec:
      restartPolicy: Never
      volumes:
        - name: restore
          emptyDir: {}
        - name: scripts
          configMap:
            name: backup-scripts
            defaultMode: 0555
      initContainers:
        - name: download
          image: amazon/aws-cli:2.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              : "${RESTORE_PREFIX:?RESTORE_PREFIX must point to an S3 postgres backup prefix}"
              aws s3 sync "s3://${S3_BUCKET}/${RESTORE_PREFIX}" /restore
          env:
            - name: RESTORE_PREFIX
              value: travel-tvb/postgres/replace-me
          envFrom:
            - configMapRef:
                name: backup-config
            - secretRef:
                name: backup-target-secret
          volumeMounts:
            - name: restore
              mountPath: /restore
      containers:
        - name: restore
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/scripts/postgres-restore.sh"]
          envFrom:
            - configMapRef:
                name: backup-config
            - secretRef:
                name: backup-target-secret
          volumeMounts:
            - name: restore
              mountPath: /restore
            - name: scripts
              mountPath: /scripts
