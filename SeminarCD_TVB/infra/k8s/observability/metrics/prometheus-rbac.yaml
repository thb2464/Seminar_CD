apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: metrics
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: travel-tvb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: travel-tvb-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: travel-tvb
rules:
  - apiGroups: [""]
    resources: ["endpoints", "nodes", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: travel-tvb-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: travel-tvb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: travel-tvb-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: metrics
