apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: metrics
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: travel-tvb
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.metrics.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: travel-tvb
        orgId: 1
        folder: Travel TVB
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
