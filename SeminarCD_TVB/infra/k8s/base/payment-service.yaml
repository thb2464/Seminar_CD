apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: travel-tvb
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/thb2464/seminar_cd/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_HOST
              value: payment-postgres
            - name: VNPAY_RETURN_URL
              value: https://api.travel-tvb.example.com/api/payments/vnpay-return
            - name: OTEL_SERVICE_NAME
              value: payment-service
          envFrom:
            - configMapRef:
                name: travel-tvb-runtime-config
            - secretRef:
                name: payment-service-secret
            - secretRef:
                name: rabbitmq-connection-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 3003
      targetPort: http
