apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-tvb-runtime-config
  labels:
    app.kubernetes.io/name: travel-tvb
data:
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_PORT: "5432"
  DATABASE_SSL: "false"
  DATABASE_SYNCHRONIZE: "false"
  BOOKING_EVENTS_EXCHANGE: booking.events
  CATALOG_EVENTS_EXCHANGE: catalog.events
  PAYMENT_EVENTS_EXCHANGE: payment.events
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger-collector.tracing.svc.cluster.local:4318/v1/traces
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_EXPORTER: otlp
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health
  CATALOG_SERVICE_URL: http://catalog-service:3001
  CATALOG_BASE_URL: http://catalog-service:3001
  CHROMADB_HOST: chromadb
  CHROMADB_PORT: "8000"
  CHROMADB_SSL: "false"
  CHROMA_COLLECTION: tour_embeddings
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_MAX_REQUESTS: "15"
  DATABASE_CLIENT: postgres
  HOST: "0.0.0.0"
