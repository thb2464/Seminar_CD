apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-service
  labels:
    app.kubernetes.io/name: ai-chatbot-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-chatbot-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-chatbot-service
        app.kubernetes.io/part-of: travel-tvb
    spec:
      containers:
        - name: ai-chatbot-service
          image: ghcr.io/thb2464/seminar_cd/ai-chatbot-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: OTEL_SERVICE_NAME
              value: ai-chatbot-service
          envFrom:
            - configMapRef:
                name: travel-tvb-runtime-config
            - secretRef:
                name: ai-chatbot-service-secret
            - secretRef:
                name: rabbitmq-connection-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-service
  labels:
    app.kubernetes.io/name: ai-chatbot-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-chatbot-service
  ports:
    - name: http
      port: 8080
      targetPort: http
