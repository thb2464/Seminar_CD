apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  labels:
    app.kubernetes.io/name: content-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: content-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-service
        app.kubernetes.io/part-of: travel-tvb
    spec:
      containers:
        - name: content-service
          image: ghcr.io/thb2464/seminar_cd/content-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          env:
            - name: PORT
              value: "1337"
            - name: DATABASE_HOST
              value: content-postgres
            - name: DATABASE_SSL
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: content-service
          envFrom:
            - configMapRef:
                name: travel-tvb-runtime-config
            - secretRef:
                name: content-service-secret
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  labels:
    app.kubernetes.io/name: content-service
    app.kubernetes.io/part-of: travel-tvb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: content-service
  ports:
    - name: http
      port: 1337
      targetPort: http
